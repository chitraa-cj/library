name: Deploy Library App

on:
  push:
    branches:
      - main

concurrency:
  group: library-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true

          script: |
            set -euo pipefail

            APP_DIR=~/library/library
            APP_NAME=sacred-script-hub

            cd $APP_DIR

            git fetch origin
            git reset --hard origin/main

            NPM_CONFIG_OMIT="" npm install --include=dev

            npm run build

            test -f dist/index.cjs

            if pm2 describe $APP_NAME >/dev/null; then
              pm2 restart $APP_NAME --update-env
            else
              pm2 start dist/index.cjs --name $APP_NAME
            fi

            pm2 save

            sleep 20

            # detect actual listening port
            PORT=$(ss -tulpn | grep node | awk '{print $5}' | tail -1 | cut -d: -f2)

            if [ -n "$PORT" ]; then
              curl --fail \
                --retry 10 \
                --retry-delay 3 \
                "http://localhost:$PORT"
            else
              echo "Skipping health check: app port not detected"
            fi

            sudo systemctl reload nginx
