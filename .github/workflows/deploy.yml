name: Deploy Library App

on:
  push:
    branches:
      - main

concurrency:
  group: library-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true

          script: |
            set -e

            cd ~/library/library

            git fetch origin
            git reset --hard origin/main
            git clean -fd

            NPM_CONFIG_OMIT="" npm install --include=dev

            npm run build

            if pm2 describe sacred-script-hub >/dev/null; then
              pm2 restart sacred-script-hub --update-env
            else
              pm2 start dist/index.cjs --name sacred-script-hub
            fi

            pm2 save

            curl -f http://localhost:3000 >/dev/null

            sudo systemctl reload nginx
